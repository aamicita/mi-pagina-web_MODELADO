steps:
  # Paso 0: Construir la imagen
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/ami-pagina-web/mi-pagina:$COMMIT_SHA', '.']

  # Paso 1: SUBIR la imagen al registro
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/ami-pagina-web/mi-pagina:$COMMIT_SHA']

  # Paso 2: Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mi-pagina'
      - '--image'
      - 'gcr.io/ami-pagina-web/mi-pagina:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# 'options' debe ir al mismo nivel que 'steps', sin espacios al principio
options:
  logging: CLOUD_LOGGING_ONLY

